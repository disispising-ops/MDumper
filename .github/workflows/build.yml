name: Build MDumper APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Fetch MobileDumper-7 if missing
        run: |
          if [ ! -f app/src/main/cpp/MobileDumper-7/CMakeLists.txt ]; then
            git clone --recursive https://github.com/MJx0/MobileDumper-7.git app/src/main/cpp/MobileDumper-7
            (cd app/src/main/cpp/MobileDumper-7 && git apply ../../../../patches/pubg_v4.7_uobject_name.patch) || true
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 ndk;26.1.10909125 cmake;3.22.1'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MDumper-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
