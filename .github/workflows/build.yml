name: Build MDumper APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ensure MobileDumper-7 subtree exists even without submodules
      - name: Fetch MobileDumper-7 if missing
        run: |
          if [ ! -f app/src/main/cpp/MobileDumper-7/CMakeLists.txt ]; then
            git clone --recursive https://github.com/MJx0/MobileDumper-7.git \
              app/src/main/cpp/MobileDumper-7
            # Apply PUBG v4.7 patch
            if [ -f patches/pubg_v4.7_uobject_name.patch ]; then
              (cd app/src/main/cpp/MobileDumper-7 && \
               git apply ../../../../patches/pubg_v4.7_uobject_name.patch) || true
            fi
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 ndk;26.1.10909125 cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build release APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MDumper-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
