name: Build MDumper APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MobileDumper-7 fresh
        run: |
          set -e
          MD7_DIR=app/src/main/cpp/MobileDumper-7
          rm -rf $MD7_DIR
          # [V-mod] Use our fork which has FortniteProfile added. Upstream MJx0/MobileDumper-7
          # only ships PUBG/DeltaForce/Valorant/NewState profiles. The fork adds Fortnite
          # (com.epicgames.fortnite) with FChunkedUObjectArray + FNamePool layouts for UE5.
          git clone --recursive --depth 1 https://github.com/disispising-ops/MobileDumper-7.git $MD7_DIR
          echo "MD7 files: $(find $MD7_DIR/Dumper -type f | wc -l)"
          if [ ! -f $MD7_DIR/libs/KittyMemoryEx/KittyMemoryEx/KittyMemoryMgr.cpp ]; then
            rm -rf $MD7_DIR/libs/KittyMemoryEx
            git clone --depth 1 https://github.com/MJx0/KittyMemoryEx.git $MD7_DIR/libs/KittyMemoryEx
          fi

      - name: Apply patches
        run: |
          set -e
          cd app/src/main/cpp/MobileDumper-7
          # .patch files via git apply
          for p in ../../../../../patches/*.patch; do
            if [ -f "$p" ]; then
              echo "patch: $p"
              git apply --verbose "$p" || { echo "FAILED: $p"; exit 1; }
            fi
          done
          # .sh scripts for things git apply can't do cleanly
          for s in ../../../../../patches/*.sh; do
            if [ -f "$s" ]; then
              echo "script: $s"
              bash "$s"
            fi
          done

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 ndk;26.1.10909125 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MDumper-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
